services:
  antigravity-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lbjlaq/antigravity-manager
    container_name: antigravity-manager
    network_mode: host  # 使用宿主机网络，可直接访问 localhost:8045
    # ports:  # host 模式不需要端口映射
    #   - "8045:8045"
    volumes:
      # 与 cursor-relay 同栈时请用同一 ABV_HOST_DATA_DIR，卡池才能共享
      - ${ABV_HOST_DATA_DIR:-~/.antigravity_tools}:/root/.antigravity_tools
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_KEY=${API_KEY:-test}  # [重要] 請設置您的安全密鑰，若不設置則在日誌中查看隨機密鑰
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - ABV_API_KEY=${API_KEY:-test}
      - ABV_WEB_PASSWORD=${WEB_PASSWORD:-}
      - ABV_BIND_LOCAL_ONLY=${ABV_BIND_LOCAL_ONLY:-true}  # 僅綁定 127.0.0.1
      - ABV_DATA_DIR=${ABV_DATA_DIR:-/root/.antigravity_tools}  # 容器内数据目录，需与上方 volume 目标路径一致
      - ABV_MAX_BODY_SIZE=${ABV_MAX_BODY_SIZE:-104857600}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
