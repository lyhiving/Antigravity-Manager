# s303 部署覆盖文件，与主栈一起使用：
#   docker compose -f docker/docker-compose.yml -f cursor-relay/docker-compose.yml up -d
#
# 主栈用 network_mode: host，relay 同样走 host，直接占用 8317。
# 与 antigravity-manager 共用 ABV_DATA_DIR，卡池数据落在 <数据目录>/cursor/cards.json。

services:
  cursor-relay:
    image: ${CURSOR_RELAY_IMAGE:-ghcr.io/lyhiving/cursor-relay:latest}
    container_name: cursor-relay
    pull_policy: always
    network_mode: host
    restart: unless-stopped
    environment:
      KYA_PROXY_HOST: 0.0.0.0
      KYA_PROXY_PORT: "8317"
      KYA_PROXY_KEY: ${CURSOR_RELAY_KEY:-sk-kya-cursor}
      ABV_DATA_DIR: /root/.antigravity_tools
      CURSOR_ADMIN_PASSWORD: ${CURSOR_ADMIN_PASSWORD:-}
      CURSOR_RENEW_WAIT_S: ${CURSOR_RENEW_WAIT_S:-120}
    volumes:
      # 卡池卡片与主栈共享
      - ${ABV_HOST_DATA_DIR:-~/.antigravity_tools}:/root/.antigravity_tools
      # cursor-agent 登录态（accessToken/refreshToken），换杯后由 relay 重写
      - cursor-relay-state:/root/.cursor
      - cursor-relay-tk:/root/.cursor-tk
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8317/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  cursor-relay-state:
  cursor-relay-tk:
