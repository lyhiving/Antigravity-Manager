<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>续杯记录 · Cursor 中转</title>
<style>
  :root{--bg:#0e1116;--card:#161b22;--line:#262d36;--fg:#e6edf3;--dim:#8b949e;--ok:#3fb950;--err:#f85149;--warn:#d29922;--accent:#388bfd}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"PingFang SC",sans-serif;overflow-x:hidden;max-width:840px;margin:0 auto}
  h1{font-size:17px;margin:4px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1 a{color:var(--dim);font-size:13px;font-weight:400;text-decoration:none}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px}
  .item{padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:32px}
  .ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#1f2a37;color:var(--dim);margin-left:6px}
  .time{color:var(--dim);font-size:12px;flex:0 0 auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .msg{color:var(--dim);font-size:12px;word-break:break-all;margin-top:4px}
  .dev{color:#5b6470;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin-top:2px}
  .hint{color:var(--dim);font-size:13px;text-align:center;padding:16px 0}
  button{font:inherit;width:100%;min-height:44px;border-radius:10px;background:#21262d;color:var(--fg);border:1px solid var(--line);margin-bottom:16px}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<h1><span>续杯记录</span><a id="back" href="#">返回控制台</a></h1>
<div class="box" id="list"><p class="hint">加载中…</p></div>
<button id="more" hidden>加载更多</button>

<script>
const $ = id => document.getElementById(id);
const PAGE = 50;
let offset = 0, total = 0;

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = sec => sec ? new Date(sec * 1000).toLocaleString() : '';

// 页面挂在 /cursor/ 之类前缀下，按当前路径推导接口根
const API = location.pathname.replace(/\/admin\/history\/?$/, '') + '/admin/api';
$('back').href = location.pathname.replace(/\/history\/?$/, '');

async function api(path){
  const res = await fetch(path);
  if(!res.ok){
    let msg = res.status;
    try{ msg = (await res.json()).detail || msg; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

function render(items){
  const box = $('list');
  if(!offset && !items.length){
    box.innerHTML = '<p class="hint">暂无续杯记录</p>';
    return;
  }
  box.insertAdjacentHTML('beforeend', items.map(h => `
    <div class="item">
      <div class="head">
        <span class="${h.ok ? 'ok' : 'err'}">
          ${h.ok ? (h.action === 'reset' ? '重置额度' : '续杯') : '失败'}${h.card ? ' · ' + esc(h.card) : ''}
          ${h.reason ? `<span class="badge">${h.reason === 'manual' ? '手动' : '自动'}</span>` : ''}
        </span>
        <span class="time">${esc(fmtTime(h.at))}</span>
      </div>
      ${h.message ? `<div class="msg">${esc(h.message)}</div>` : ''}
      ${h.deviceId ? `<div class="dev">${esc(h.deviceId)}</div>` : ''}
    </div>`).join(''));
}

async function load(){
  $('more').disabled = true;
  try{
    const d = await api(`${API}/history?limit=${PAGE}&offset=${offset}`);
    total = d.total;
    render(d.items);
    offset += d.items.length;
    $('more').textContent = `加载更多（已显示 ${offset}/${total}）`;
    $('more').hidden = offset >= total;
  }catch(e){
    $('list').innerHTML = `<p class="hint">读取失败：${esc(e.message)}</p>`;
    $('more').hidden = true;
  }
}

$('more').onclick = () => { $('more').disabled = true; load(); };
load();
</script>
</body>
</html>
