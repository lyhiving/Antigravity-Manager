name: Manager Image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "src-tauri/**"
      - "docker/Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.cjs"
      - "index.html"
      - ".github/workflows/manager-image.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 上游只走 tag + Docker Hub，我们这里补一条 main 分支的 GHCR 通道，
      # 这样控制台改动（登录修复、Cursor tab）不用发 release 就能上线。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/antigravity-manager:latest
            ghcr.io/${{ github.repository_owner }}/antigravity-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
