name: Cursor Relay Image

on:
  push:
    branches: [main, master]
    paths:
      - "cursor-relay/**"
      - ".github/workflows/cursor-relay.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pool.py 只依赖标准库，可直接在 runner 上跑决策树自检
      - name: Sanity check pool decision tree
        run: python3 cursor-relay/test_pool.py

      # app/direct.py 同样是标准库，帧格式与解码器无需装 litellm 即可验证
      - name: Sanity check AgentService wire format
        run: python3 cursor-relay/test_direct.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cursor-relay
          file: cursor-relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cursor-relay:latest
            ghcr.io/${{ github.repository_owner }}/cursor-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
